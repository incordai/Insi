[package]
name = "insi"
description = "Insi: self-improving coding agents, governed by humans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agents", "llm", "evaluation", "harness", "code"]
categories = ["development-tools", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "insi"
path = "src/main.rs"

[dependencies]
insi-core.workspace = true
insi-eval.workspace = true
insi-memory.workspace = true
insi-loop.workspace = true
insi-connectors.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
flate2.workspace = true
# The worker's sandbox (`insi sandbox run`, src/sandbox.rs): our own, the library behind `insbx`, pinned to a commit.
incord-sandbox.workspace = true

# Windows only: the icon and name in Task Manager and Explorer (assets/insi.rc). Does nothing on other systems.
[build-dependencies]
embed-resource = "3.0.11"

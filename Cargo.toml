[workspace]
resolver = "2"
members = ["crates/insi-core", "crates/insi-eval", "crates/insi-memory", "crates/insi-loop", "crates/insi-connectors", "crates/insi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89: std's File::lock, which keeps two insi runs sharing a work folder
# out of each other's way.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/incordai/insi"

# Three dependencies, all already in incode's lock at these versions (see
# .incord/RULE_ACK for the vetting). Phase 1 drives git and the worker through
# std processes: no HTTP client, async runtime or argument parser yet.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Versions as well as paths, so each crate can be published: crates.io
# resolves by version, the workspace by path.
insi-core = { path = "crates/insi-core", version = "0.1.0" }
insi-eval = { path = "crates/insi-eval", version = "0.1.0" }
insi-memory = { path = "crates/insi-memory", version = "0.1.0" }
insi-loop = { path = "crates/insi-loop", version = "0.1.0" }
insi-connectors = { path = "crates/insi-connectors", version = "0.1.0" }

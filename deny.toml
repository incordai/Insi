# All resolved dependencies, including development and platform dependencies.
[graph]
all-features = true

[advisories]
# Vulnerabilities fail by default; also reject unmaintained transitive crates.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

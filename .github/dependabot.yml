version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packaging/npm
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /packaging/pip
    schedule:
      interval: monthly

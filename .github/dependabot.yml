version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /packaging/npm
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /packaging/pip
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

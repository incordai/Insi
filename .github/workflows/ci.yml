# Formatting, lints and tests on the three platforms Insi runs on. The tests
# drive real git repositories and real processes (deadlines, process trees),
# which is why every platform runs them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-controls:
    name: security language and native-memory controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the released action; the Rust version is selected explicitly below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # Install actual runtimes so language controls cannot silently pass as skips in this job.
      - run: |
          sudo apt-get update
          sudo apt-get install -y php-cli golang-go nodejs python3-venv
          python3 -m venv .incord/temp/security-ci-venv
          .incord/temp/security-ci-venv/bin/python -m pip install -r scripts/security/requirements.txt
      - run: |
          export PATH="$PWD/.incord/temp/security-ci-venv/bin:$PATH"
          for program in php go node rustc semgrep; do command -v "$program" || exit 1; done
          python -m unittest discover -s scripts/security -p 'test_*.py'
      # The same sanitizer must reject planted faults and accept fixed controls under Linux.
      - run: |
          image_id=$(docker build --quiet -f scripts/security/memory.Dockerfile scripts/security)
          python3 scripts/security/native_memory.py --image "$image_id" --output native-memory.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory-controls
          path: native-memory.json

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the released action; the Rust version is selected explicitly below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  packaging:
    name: packaging (${{ matrix.os }}, Python ${{ matrix.python }})
    # Pinned: ubuntu-latest now resolves to Ubuntu 26.04, which has no
    # Python 3.9 build for actions/setup-python. The upstream Python
    # manifest lists x64 Ubuntu 24.04 builds for 3.9.25 and 3.12.16.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m unittest discover -s packaging/pip -p 'test_*.py'
      - run: python -m unittest discover -s scripts/checks -p 'test_*.py'
      - run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      # Portable controls run everywhere; missing optional runtimes/scanners are explicit skips.
      - run: python -m unittest discover -s scripts/security -p 'test_*.py'
      - run: node packaging/npm/test.js
      # Every own Python, JavaScript and shell file carries the license header (Rust files: cargo test).
      - run: node scripts/license-headers.mjs --check

  artifacts:
    name: artifact round trip
    runs-on: ubuntu-latest
    steps:
      - name: Create fixture
        run: |
          mkdir -p .claude/temp/artifact-source
          printf 'insi artifact integrity\n' > .claude/temp/artifact-source/payload.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-action-smoke
          path: .claude/temp/artifact-source/payload.txt
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-action-smoke
          path: .claude/temp/artifact-download
          merge-multiple: true
      - name: Verify fixture bytes
        run: cmp .claude/temp/artifact-source/payload.txt .claude/temp/artifact-download/payload.txt

  msrv:
    name: msrv (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the released action; the Rust version is selected explicitly below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace --all-targets --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the released action; the Rust version is selected explicitly below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151
      - run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - run: cargo llvm-cov nextest --workspace --all-features --locked --profile ci --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - name: HTML coverage
        run: cargo llvm-cov report --html
      - name: Preserve coverage and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-and-junit
          path: |
            lcov.info
            target/llvm-cov/html/
            target/nextest/ci/junit.xml

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the released action; the Rust version is selected explicitly below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --doc --workspace --locked

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@53821664afd79bb88fcdd22fdc2f49d8d3f6cac9 # v1

  workflows:
    name: workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Same scope as CONTRIBUTING.md: the workflows and Dependabot config.
          inputs: .github
          advanced-security: false
          version: 1.30.1

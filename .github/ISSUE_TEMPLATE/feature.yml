name: Feature request
description: Suggest a scoped improvement to Insi.
title: "feature: "
body:
  - type: markdown
    attributes:
      value: A maintainer reviews requests before any agent is authorized to work on them.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the use case and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome and how we would verify it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

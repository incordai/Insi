# Insi has no persistent local service or deployed host. Benchmark failures
# are valid data. This checks job configuration, not remote job outcomes.
[[check]]
name = "evaluation records are readable"
command = "python3 scripts/checks/project_health.py records"
every_minutes = 60
timeout_secs = 20
paths = ["crates/insi-eval/src/store.rs", "scripts/checks/project_health.py"]

[[check]]
name = "dependency audit remains scheduled"
command = "python3 scripts/checks/project_health.py jobs"
every_minutes = 1440
timeout_secs = 20
paths = [".github/workflows/dependencies.yml"]

[[check]]
name = "workspace has space for evaluation artifacts and logs"
command = "python3 scripts/checks/project_health.py disk"
every_minutes = 60
timeout_secs = 20
paths = ["crates/insi-eval/src/run.rs", "crates/insi-eval/src/process.rs"]

[[check]]
name = "candidate approval denial prevents edit execution"
command = "python3 scripts/checks/audit_bridge.py"
every_minutes = 60
timeout_secs = 120
paths = ["crates/insi/src/audit_bridge.rs", "scripts/checks/audit_bridge.py"]


# BEGIN INSI WATCH MODULE
# INSI CHECK CATALOG v1
# Only this segment belongs to Insi; preserve all Inmem/agent modules outside it.
# This is an agent-maintained Inmem watch file, not a claim every scanner is enabled.
# Active [[check]] entries run on Inmem's scheduler. Commented entries are templates.
# Agents: read the existing file first; preserve user checks, names, schedules and edits.
# Select checks for the actual stack, install/verify prerequisites, run each command once,
# then append/uncomment only the applicable checks. Give checks stable unique names.
# Record incomplete/missing tooling as a gap; never use `|| true` to hide failures.
# Use project-specific paths, roles, routes, fixtures and expected behavior.
# Keep credentials out of this file. Use environment variables/local secret storage.
# Do not schedule workers, fixes, installs, commits, pushes or PR publication as checks.
# Avoid scheduling both a complete suite and its individual tests redundantly.
# Inmem reads .incord/watch.toml; Insi does not start a second scheduler.


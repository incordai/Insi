# --- Application contracts: create this script for the app before enabling ---
# [[check]]
# name = "insi: security application boundaries"
# command = "python3 scripts/security/check_application.py"
# every_minutes = 1440
# timeout_secs = 300
# paths = ["src", "tests/security", "scripts/security/check_application.py"]
# The script must assert real authentication/expiry/revocation, API object/method
# ownership, CSRF/origins, SSRF direct/redirect/private-canary behavior, uploads,
# TLS validation and business-logic replay/concurrency against disposable targets.
# Include unsafe positive and fixed/ordinary negative controls, bounded requests,
# private reports and cleanup. Reference fixtures are shipped in the Insi source;
# these fixture scripts are not automatically copied into an unrelated app.

# --- Network / browser / memory extensions ---
# Nmap: explicit lab target and ports only; open ports are observations, not exploits.
# sqlmap/Metasploit: disposable targets only; normalize evidence and failure exits.
# Browser: assert a real DOM/canary effect and its blocked fixed control.
# Managed memory: compare retained allocations/listeners/goroutines after cleanup.
# Native memory: ASan/LSan instrumented binaries with expected diagnostic + exit.
# Java: application-specific heap/growth tests; profiler availability is not coverage.
# Health: project HTTP/storage/disk checks must use real local configuration and
# must fail if the target is unavailable rather than claiming a clean result.

# Insi's portable fixture suite; optional installed scanner tests report skips when tools are absent.
# This checks the seeded controls, not the security of an arbitrary application.
[[check]]
name = "insi: security fixture regressions"
command = "python3 scripts/security/run_checks.py"
every_minutes = 1440
timeout_secs = 180
paths = ["scripts/security", "crates/insi/src/review_security.rs"]
# END INSI WATCH MODULE
